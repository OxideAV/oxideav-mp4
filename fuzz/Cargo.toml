[package]
name = "oxideav-mp4-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95"

[package.metadata]
cargo-fuzz = true

# The MP4 / ISO Base Media File Format demuxer is the rich fuzz
# surface for this crate: every container nesting level is a
# `size:u32 / type:FourCC [/ largesize:u64]` length-prefixed box,
# and the parser has to recurse into `moov > trak > mdia > minf >
# stbl > ...` (plus the fragmented `moof > traf > trun` parallel
# tree) entirely driven by attacker-controlled length and count
# fields. Classic attacker primitives this target exercises:
#
#   * Box size overflow / underflow — a `size:u32 = 0` means
#     "extends to EOF"; `size:u32 = 1` means "read a 64-bit
#     `largesize` next"; any other value < 8 is malformed; and a
#     well-formed `largesize` can encode values larger than the
#     remaining file. The walker's child-vs-parent arithmetic has
#     to bound every recursion.
#   * Nested-box recursion depth (`moov > trak > edts > elst`,
#     `meta > ilst > item > data`, fragmented `moof > traf`,
#     `udta > meta > ilst`, etc.) — unbounded recursion across a
#     pathological deep nest is a stack-blow vector.
#   * Sample-table allocation arithmetic — `stsz.sample_size = 0`
#     means "see per-sample table of length `sample_count`"; the
#     `stsc` run-length form can describe billions of samples in a
#     handful of bytes; `stco`/`co64` chunk offsets must each be
#     in-file. A naive `Vec::with_capacity(sample_count as usize)`
#     here would OOM on a tiny crafted input.
#   * `tfhd` / `trun` arithmetic — the trun loop reads per-sample
#     size, duration, flags and composition-time-offset from the
#     fragment body, all bounded only by attacker-supplied counts.
#   * Edit-list arithmetic — `elst` `media_time` is signed and
#     `media_rate` is a fixed-point fraction; segment durations are
#     in the movie timescale, which can be zero (divide-by-zero
#     vector for any presentation-time math).
#   * Sample-entry inner parsers — `avcC` / `hvcC` / `dOps` /
#     `dfLa` / `esds` BER-encoded descriptors are recursively
#     length-prefixed and live inside an outer sample entry whose
#     `data_reference_index` is attacker-controlled.
#   * Fragmented MP4 — `mvex.trex` defaults bind to per-fragment
#     `traf.tfhd`; `default-base-is-moof`, `base_data_offset`
#     overrides, and `tfdt.baseMediaDecodeTime` all participate in
#     the file-offset arithmetic that locates sample bytes.
#
# There is no external cross-decode oracle worth pulling in (the
# clean-room wall bars every third-party ISO BMFF implementation as
# a reference anyway), so the oracle is **ourselves**: six targets
# split the surface between "arbitrary hostile bytes must open or
# error, never panic" (demux, box_parsers) and "valid-by-construction
# recipes must round-trip byte-exactly through our own muxer +
# demuxer / builder + parser / encrypt + decrypt pairs"
# (mux_roundtrip, meta_graph, cenc_roundtrip), with structured_mutate
# corrupting writer-shaped fixtures so the fuzzer starts deep inside
# the box tree instead of fishing for a parseable moov.
[dependencies]
libfuzzer-sys = "0.4"
oxideav-core = "0.1"

[dependencies.oxideav-mp4]
path = ".."

# Prevent this from interfering with the umbrella workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

# Shared scaffolding: the Recipe byte-reader, the valid-by-construction
# MuxPlan (plain / faststart / fragmented layouts), and the full-accessor
# demux exercise battery every hostile target funnels into.
[lib]
name = "oxideav_mp4_fuzz"
path = "src/lib.rs"
test = false
doc = false

# Target 1: arbitrary hostile bytes through the typed demuxer open
# front + full accessor battery + bounded drain + both seek paths.
[[bin]]
name = "demux"
path = "fuzz_targets/demux.rs"
test = false
doc = false

# Target 2: hostile bytes through every standalone public box parser
# (HEIF item catalogue, CENC/PIFF, emsg, FD, hint, sample-group blobs,
# QuickTime atoms, aux-info/random-access records), with parse∘build
# fixed-point asserts wherever the byte-exact builder dual exists.
[[bin]]
name = "box_parsers"
path = "fuzz_targets/box_parsers.rs"
test = false
doc = false

# Target 3: valid-by-construction mux recipes must round-trip — mux,
# re-open, byte-exact payloads + pts (plain / faststart / fragmented
# incl. styp + sidx/mfra indexes, edit lists, empty-time gaps).
[[bin]]
name = "mux_roundtrip"
path = "fuzz_targets/mux_roundtrip.rs"
test = false
doc = false

# Target 4: structure-aware corruption of writer-shaped fixtures —
# byte flips, truncations, and targeted overwrites right after the
# sample-table / fragment / index FourCCs the offset walkers
# arithmetic on.
[[bin]]
name = "structured_mutate"
path = "fuzz_targets/structured_mutate.rs"
test = false
doc = false

# Target 5: HEIF item graphs — builder-assembled iloc/iinf/iref/ipma
# catalogues (cycles, dangling IDs, every construction method) must
# reparse identically, then survive hostile mutation of the meta body.
[[bin]]
name = "meta_graph"
path = "fuzz_targets/meta_graph.rs"
test = false
doc = false

# Target 6: CENC — encrypt∘decrypt identity under arbitrary-but-valid
# §10 scheme × tenc × subsample-partition metadata, hostile
# plan_sample_cipher walks, and hostile senc/seig parses.
[[bin]]
name = "cenc_roundtrip"
path = "fuzz_targets/cenc_roundtrip.rs"
test = false
doc = false
